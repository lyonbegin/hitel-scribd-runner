name: Windows Scribd 814 Public Preview Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/scribd-windows-preview.yml

permissions:
  contents: read

concurrency:
  group: scribd-windows-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'lyonbegin/hitel-scribd-runner'
    runs-on: self-hosted
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Fetch known public repository using Git
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path src\.git) {
            git -C src fetch --depth 1 origin main
            if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
            git -C src reset --hard origin/main
            if ($LASTEXITCODE -ne 0) { throw 'git reset failed' }
          } else {
            git clone --depth 1 --branch main https://github.com/lyonbegin/hitel-scribd-runner.git src
            if ($LASTEXITCODE -ne 0) { throw 'git clone failed' }
          }
          if (-not (Test-Path src\tools\zocbo\unresolved_814_ids.txt)) {
            throw 'Document ID queue not found'
          }

      - name: Check Windows and installed Google Chrome
        run: |
          if ($env:RUNNER_OS -ne 'Windows') {
            throw 'This workflow requires a Windows self-hosted runner'
          }
          $chromeCandidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$([Environment]::GetEnvironmentVariable('ProgramFiles(x86)'))\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $chromeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw 'Google Chrome was not found on this Windows account' }
          Write-Host 'Windows and Google Chrome detected'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          if ($LASTEXITCODE -ne 0) { throw 'Playwright install failed' }
          python -m playwright --version
          if ($LASTEXITCODE -ne 0) { throw 'Playwright verification failed' }

      - name: Inspect first three public Scribd document previews
        run: |
          python src/tools/zocbo/scribd_814_preview_crawler.py --ids-file src/tools/zocbo/unresolved_814_ids.txt --probe
          if ($LASTEXITCODE -ne 0) { throw 'Browser inspection failed' }

      - name: Show actual preview results
        if: always()
        run: |
          if (Test-Path scribd814-results\probe\summary.json) {
            Get-Content scribd814-results\probe\summary.json
          } else {
            Write-Host 'No browser summary was produced'
          }

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scribd814-windows-probe
          path: scribd814-results/probe/
          if-no-files-found: warn
          retention-days: 7
