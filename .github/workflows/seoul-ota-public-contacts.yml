name: Seoul public OTA + short-let contact evidence (rolling)
on:
  schedule:
    - cron: "19 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/seoul-ota-public-contacts.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: seoul-ota-public-contacts-single-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/seoul-homestay-public-20261121
          fetch-depth: 0
          persist-credentials: true
      - name: Install public parsing libraries
        run: python -m pip install -q requests beautifulsoup4
      - name: Restore frozen first-day 5317-row baseline (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/seoul-ota/permit_history.json ]; then
            mkdir -p artifacts/seoul-baseline
            gh run download 44875897491 --repo lyonbegin/hitel-scribd-runner --name seoul-homestay-25-district-source --dir artifacts/seoul-baseline
            test -f artifacts/seoul-baseline/seoul_facility_le60.csv
          else
            echo 'Historical licenses already retained in GitHub'
          fi
      - name: Recover 250 searches from failed Git push #44880839882 (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, pathlib
          s=pathlib.Path("data/seoul-ota/state.json")
          count=json.loads(s.read_text()).get("total_stages_completed",0) if s.exists() else 0
          print("CHECKPOINT_BEFORE_RECOVERY",count)
          with open("/tmp/seoul_ota_restore_needed","w") as f: f.write("yes" if count<537 else "no")
          PY
          if [ "$(cat /tmp/seoul_ota_restore_needed)" = "yes" ]; then
            mkdir -p "$RUNNER_TEMP/seoul-ota-recovery"
            gh run download 44880839882 --repo lyonbegin/hitel-scribd-runner --name seoul-public-ota-contact-audit --dir "$RUNNER_TEMP/seoul-ota-recovery"
            python - <<'PY'
          import os,json,pathlib,shutil
          old=pathlib.Path(os.environ["RUNNER_TEMP"])/"seoul-ota-recovery/data/seoul-ota"
          latest=pathlib.Path("data/seoul-ota")
          assert old.is_dir(), "Failed-run artifact has no checkpoint data"
          recovered=json.loads((old/"state.json").read_text())
          prior=json.loads((latest/"state.json").read_text()) if (latest/"state.json").exists() else {}
          assert recovered["total_stages_completed"]>=537, "Not the expected 250-stage checkpoint"
          assert recovered["total_stages_completed"]>=prior.get("total_stages_completed",0), "Refusing stale checkpoint"
          latest.mkdir(parents=True,exist_ok=True)
          for p in old.iterdir():
              if p.is_file():shutil.copy2(p,latest/p.name)
          print("RECOVERED_CHECKPOINT",recovered["total_stages_completed"])
          PY
          else
            echo "Checkpoint already present. No restore needed."
          fi
      - name: Validate OTA crawler without network
        run: python tools/realestate/seoul_ota_public_contacts.py --selftest
      - name: Refresh official Seoul 25-district license source
        run: python tools/realestate/seoul_homestay_collect_all.py
      - name: Reject incomplete official source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifacts/seoul-homestay/all_districts_manifest.json').read_text())
          print('districts:',m['fetched_districts'],'total:',m['count'],'<=60m2:',m['facility_le60'])
          if m['fetched_districts'] != 25 or m['count'] < 9000 or m['facility_le60'] < 5000:
              raise SystemExit('SOURCE_INCOMPLETE: refusing partial input')
          PY
      - name: Discover public OTA and short-let listing evidence
        run: python tools/realestate/seoul_ota_public_contacts.py --batch-size 250 --max-results 10 --delay 1.2
      - name: Validate complete 5k-property contact index
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          d=Path('data/seoul-ota')
          m=json.loads((d/'manifest.json').read_text())
          n=m['consolidated_index']
          print('SOURCED_INDEX',json.dumps(n,ensure_ascii=False))
          assert m['official_rows']>=5317
          assert n['records']==m['official_rows']
          assert n['prior_source_records']>=20
          assert n['public_contact_source_rows']>=13
          assert n['listing_link_rows']>=15
          with (d/'listing_evidence.csv').open(encoding='utf-8-sig',newline='') as f:
              assert all(x['match_grade']!='unverified' for x in csv.DictReader(f))
          PY
      - name: Commit cumulative progress and verified-source references
        if: always()
        run: |
          if [ ! -d data/seoul-ota ]; then
            echo "No crawl state to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seoul-ota/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data(realestate): checkpoint public OTA research [skip ci]"
            # The 250-stage run failed because the remote branch was updated
            # after checkout. Rebase ONLY our new data commit; no force push.
            git fetch origin research/seoul-homestay-public-20261121
            git rebase origin/research/seoul-homestay-public-20261121
            git push origin HEAD:research/seoul-homestay-public-20261121
          fi
      - name: Preserve run diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-public-ota-contact-audit
          path: |
            data/seoul-ota/
            artifacts/seoul-homestay/all_districts_manifest.json
            artifacts/seoul-baseline/all_districts_manifest.json
          retention-days: 30
          if-no-files-found: warn
