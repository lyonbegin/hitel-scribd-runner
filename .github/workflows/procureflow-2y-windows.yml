name: ProcureFlow 2-year G2B - Windows Chrome evidence pilot
run-name: "G2B 2024-11-13 to 2026-11-13 | HITEL Windows Chrome"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pilot or full; full is high volume and requires complete source adapters"
        required: true
        type: choice
        options: [pilot, full]
        default: pilot
  push:
    branches: [feature/procureflow-g2b-2y-win-20261114]
    paths: [.github/workflows/procureflow-2y-windows.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: procureflow-2y-windows
  cancel-in-progress: false
jobs:
  windows-g2b-pilot:
    if: github.repository == 'lyonbegin/hitel-scribd-runner'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: Validate logged-in Windows GUI runner
        run: |
          $ErrorActionPreference = 'Stop'
          $session = (Get-Process -Id $PID).SessionId
          Write-Host "GUI_PREFLIGHT runner=$env:RUNNER_NAME session=$session"
          if ($session -eq 0) { throw 'Windows runner service Session 0: visible Chrome is unavailable' }
      - name: Clone exact audited HITEL branch without checkout EBUSY
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP "procureflow2y-$env:GITHUB_RUN_ID"
          if (Test-Path $folder) { Remove-Item $folder -Recurse -Force }
          git clone --depth 1 --branch feature/procureflow-g2b-2y-win-20261114 https://github.com/lyonbegin/hitel-scribd-runner.git $folder
          if ($LASTEXITCODE -ne 0) { throw 'git clone failed' }
          $actual = (git -C $folder rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "Source SHA mismatch expected=$env:GITHUB_SHA actual=$actual" }
          "PROCFLOW_SOURCE_DIR=$folder" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SOURCE_VERIFIED commit=$actual"
      - name: Verify Playwright Python installed
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command py -ErrorAction SilentlyContinue) {
            py -3 -m pip show playwright
            if ($LASTEXITCODE -ne 0) { py -3 -m pip install --disable-pip-version-check playwright==1.56.0 }
            if ($LASTEXITCODE -ne 0) { throw 'Playwright install failed' }
          } else {
            python -m pip show playwright
            if ($LASTEXITCODE -ne 0) { python -m pip install --disable-pip-version-check playwright==1.56.0 }
            if ($LASTEXITCODE -ne 0) { throw 'Playwright install failed' }
          }
      - name: Syntax validation and all 2-year windows planning
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:PROCFLOW_SOURCE_DIR 'tools/procureflow/g2b_2y_windows.py'
          if (Get-Command py -ErrorAction SilentlyContinue) {
            py -3 -m py_compile $script
            if ($LASTEXITCODE -ne 0) { throw 'syntax check failed' }
            py -3 $script --mode plan --max-windows 0
          } else {
            python -m py_compile $script
            if ($LASTEXITCODE -ne 0) { throw 'syntax check failed' }
            python $script --mode plan --max-windows 0
          }
          if ($LASTEXITCODE -ne 0) { throw 'planning failed' }
      - name: Restore prior verified G2B raw evidence and page checkpoints
        uses: actions/download-artifact@v4
        with:
          name: procureflow-2y-windows-source-evidence
          run-id: 43451369673
          github-token: ${{ github.token }}
          path: procureflow-2y-evidence
      - name: Real Chrome smoke for first and last historical day
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:PROCFLOW_SOURCE_DIR 'tools/procureflow/g2b_2y_windows.py'
          $output = Join-Path $env:GITHUB_WORKSPACE 'procureflow-2y-evidence'
          $cmd = @($script, '--mode', 'smoke', '--tabs', '10', '--max-pages', '2',
                   '--details-per-window', '2', '--run-timeout', '1800',
                   '--output', $output)
          if (Get-Command py -ErrorAction SilentlyContinue) { & py -3 @cmd } else { & python @cmd }
          if ($LASTEXITCODE -ne 0) { throw 'Historical smoke failed; inspect checkpoints before bulk run' }
      - name: Capture first two complete weekly listing windows
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'pilot'
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:PROCFLOW_SOURCE_DIR 'tools/procureflow/g2b_2y_windows.py'
          $output = Join-Path $env:GITHUB_WORKSPACE 'procureflow-2y-evidence'
          $cmd = @($script, '--mode', 'batch', '--tabs', '10',
                   '--window-offset', '0', '--max-windows', '2',
                   '--max-pages', '120', '--details-per-window', '2',
                   '--run-timeout', '4200', '--output', $output)
          if (Get-Command py -ErrorAction SilentlyContinue) { & py -3 @cmd } else { & python @cmd }
          if ($LASTEXITCODE -ne 0) { throw 'First two weekly windows failed: inspect evidence and resume' }
      - name: Optional entire date horizon for implemented web sources
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:PROCFLOW_SOURCE_DIR 'tools/procureflow/g2b_2y_windows.py'
          $output = Join-Path $env:GITHUB_WORKSPACE 'procureflow-2y-evidence'
          $cmd = @($script, '--mode', 'full', '--tabs', '10',
                   '--run-timeout', '9900', '--output', $output)
          if (Get-Command py -ErrorAction SilentlyContinue) { & py -3 @cmd } else { & python @cmd }
          if ($LASTEXITCODE -ne 0) { throw 'Collection not complete: preserve partial evidence and resume' }
      - name: Print summary and failure evidence
        if: always()
        run: |
          $p = Join-Path $env:GITHUB_WORKSPACE 'procureflow-2y-evidence/summary.json'
          if (Test-Path $p) { Get-Content $p -Encoding utf8 }
          else { Write-Host 'NO_SUMMARY: step may have failed before browser work' }
      - name: Upload raw public JSON, SHA evidence, and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procureflow-2y-windows-source-evidence
          path: procureflow-2y-evidence/
          if-no-files-found: warn
          retention-days: 7
