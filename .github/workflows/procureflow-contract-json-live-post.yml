name: ProcureFlow 2Y - real signed contract JSON POST test
run-name: "PF2 | contract JSON direct POST | official select endpoint + real source hash"
on:
  push:
    branches: [research/procureflow-contract-web-probe-20261116]
    paths:
      - .github/workflows/procureflow-contract-json-live-post.yml
      - tools/procureflow/test_real_g2b_contract_json_post.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pf2-contract-json-public-direct-post
  cancel-in-progress: false
jobs:
  inspect-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome and Playwright
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then
            python -m playwright install --with-deps chrome
          fi
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          python -m py_compile tools/procureflow/test_real_g2b_contract_json_post.py
      - name: Fetch REAL contract JSON from verified public select endpoints
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            python tools/procureflow/test_real_g2b_contract_json_post.py
      - name: Preserve every original JSON response and checksum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf2-real-contract-json-${{ github.run_id }}
          path: ${{ runner.temp }}/pf2-real-contract-json/
          if-no-files-found: warn
          retention-days: 90
