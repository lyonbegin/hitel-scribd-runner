name: ProcureFlow 2Y - historical delivery report rendering API
run-name: "PF2 | detect public MSTR report result provider from actual JS"
on:
  push:
    branches: [research/procureflow-contract-web-probe-20261116]
    paths:
      - .github/workflows/procureflow-datahub-mstr-source.yml
      - tools/procureflow/inspect_datahub_mstr_public_modules.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Setup Python and Chrome
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then python -m playwright install --with-deps chrome; fi
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y xvfb; fi
          python -m py_compile tools/procureflow/inspect_datahub_mstr_public_modules.py
      - name: Source-proven report result API inspection (read only)
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            python tools/procureflow/inspect_datahub_mstr_public_modules.py
      - name: Save public script source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf2-datahub-mstr-source-${{ github.run_id }}
          path: ${{ runner.temp }}/pf2-mstr-source/
          retention-days: 90
          if-no-files-found: warn
