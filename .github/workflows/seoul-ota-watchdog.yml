name: Seoul OTA watchdog - independent monitoring and safe restart
run-name: "OTA watchdog check / ${{ github.event_name }}"
on:
  schedule:
    # GitHub hosted cron has a five-minute minimum. Poll again inside each job.
    - cron: "2-59/5 * * * *"
  workflow_run:
    workflows:
      - Seoul public OTA + short-let contact evidence (rolling)
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/seoul-ota-watchdog.yml
permissions:
  contents: read
  actions: write
concurrency:
  group: seoul-ota-watchdog-one-controller
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify independent watchdog and guardian logic
        run: |
          python3 tools/realestate/seoul_ota_watchdog.py --selftest
          python3 tools/realestate/seoul_ota_guardian.py --selftest
      - name: Check worker and durable heartbeat at 0, 2 and 4 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          OTA_STALE_SECONDS: "480"
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python3 tools/realestate/seoul_ota_watchdog.py --checks 1 --interval 120
          else
            python3 tools/realestate/seoul_ota_watchdog.py --checks 3 --interval 120
          fi
      - name: Publish observation, cancellation and resume record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-ota-watchdog-diagnostics
          path: artifacts/seoul-ota-watchdog/report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Dispatch next watchdog run before this one exits
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/realestate/seoul_ota_guardian.py --mode chain
      - name: Preserve guardian handoff diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-ota-watchdog-handoff
          path: artifacts/seoul-ota-watchdog/guardian.json
          retention-days: 30
          if-no-files-found: warn
