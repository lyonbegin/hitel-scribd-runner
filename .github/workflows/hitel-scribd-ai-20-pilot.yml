name: HITEL real Scribd 20-title named room AI pilot
on:
  push:
    branches: [main]
    paths: [.github/workflows/hitel-scribd-ai-20-pilot.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hitel-scribd-ai-18109-transport
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hitel-public-ai-batches-20261119
      - name: Verify exact real original 18109 rows and recreate CSV
        run: |
          python3 - <<'PY'
          import csv,hashlib
          from pathlib import Path
          paths=sorted(Path('data/raw_18109').glob('part_*.csv'))
          assert len(paths)==20,len(paths)
          content=b'\xef\xbb\xbf'+''.join(p.read_text('utf-8') for p in paths).replace('\n','\r\n').encode('utf-8')
          sha=hashlib.sha256(content).hexdigest()
          assert sha=='c9ac45f833dd30a002cffac64cb3ced763ed4eb18b0e121c4ab00b935a9b82e3',sha
          Path('Raw_Documents_18109.csv').write_bytes(content)
          with open('Raw_Documents_18109.csv',encoding='utf-8-sig',newline='') as f:rows=list(csv.DictReader(f))
          assert len(rows)==18109
          assert len(set(x['문서 ID'] for x in rows))==18109
          print('SOURCE_VERIFIED_18109_18109')
          for i,x in enumerate(rows[:20],1):print('TITLE_ID',i,x['문서 ID'],x['원문 제목'][:85])
          PY
          python3 -m py_compile tools/zocbo/hitel_public_named_rooms_corpus.py
      - name: One real API request with twenty distinct titles, in stable new named room
        run: |
          python3 tools/zocbo/hitel_public_named_rooms_corpus.py \
            --input Raw_Documents_18109.csv --out hitel-ai-batches \
            --limit 20 --batch-size 20 --workers 1 \
            --max-batches 1 --poll-seconds 750
      - name: Verify all 20 original IDs got actual AI-classified results
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,json
          path=Path('hitel-ai-batches/Scribd_AI_분류결과.csv')
          with path.open(encoding='utf-8-sig',newline='') as f:rows=list(csv.DictReader(f))
          with Path('Raw_Documents_18109.csv').open(encoding='utf-8-sig',newline='') as f:raw=list(csv.DictReader(f))[:20]
          assert len(rows)==20
          assert len({r['문서 ID'] for r in rows})==20
          for i,(a,b) in enumerate(zip(rows,raw),1):
            assert a['번호']==str(i)
            assert a['문서 ID']==b['문서 ID'] and a['원문 제목']==b['원문 제목']
            assert a['학교급']!='미처리',a
            assert a['판정 근거'],a
          status=json.loads(Path('hitel-ai-batches/status.json').read_text('utf-8'))
          assert status['verified_ai_completed']==20,status
          print('PASS_REAL_AI_20_OF_20')
          print('AI_CLASSIFICATIONS',json.dumps([{'no':r['번호'],'title':r['원문 제목'],'school':r['학교급'],'subject':r['2022 세부과목'],'download':r['다운로드']} for r in rows],ensure_ascii=False))
          PY
      - name: Publish full evidence and resume checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-scribd-ai-real20-checkpoint
          path: hitel-ai-batches/
          if-no-files-found: warn
          retention-days: 90
