name: Naver Land Chrome tourism-corridor rental probe
run-name: "Naver Land | Seoul tourist 1F housing rent | Chrome"
on:
  push:
    branches:
      - research/naver-land-chrome-20261119
    paths:
      - .github/workflows/naver-land-chrome-probe.yml
      - tools/realestate/naver_land_chrome.py
      - tools/realestate/naver_land_domain_probe.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: naver-land-chrome-probe
  cancel-in-progress: true
jobs:
  naver-chrome-smoke:
    if: github.repository == 'lyonbegin/hitel-scribd-runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real browser driver and Chromium fallback
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            echo "Google Chrome missing; install supported Chromium"
            python -m playwright install chromium
          fi
          python -m py_compile tools/realestate/naver_land_domain_probe.py
      - name: Open Naver Pay Land with real Chrome and inspect public listings
        shell: bash
        run: |
          set -euo pipefail
          python tools/realestate/naver_land_domain_probe.py
      - name: Preserve evidence - screenshot, listing CSV and detailed JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-land-domain-evidence
          path: naver-domain-results/
          retention-days: 7
          if-no-files-found: warn
