name: Naver Land Chrome tourism-corridor rental probe
run-name: "Naver Land | Seoul tourist 1F housing rent | Chrome"
on:
  push:
    branches:
      - research/naver-land-chrome-20261119
    paths:
      - .github/workflows/naver-land-chrome-probe.yml
      - tools/realestate/naver_land_chrome.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: naver-land-chrome-probe
  cancel-in-progress: false
jobs:
  naver-chrome-smoke:
    if: github.repository == 'lyonbegin/hitel-scribd-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real browser driver and Chromium fallback
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
          which google-chrome || true
          google-chrome --version || true
          python -m py_compile tools/realestate/naver_land_chrome.py
      - name: Open Naver Pay Land with real Chrome and inspect public listings
        shell: bash
        run: |
          set -euo pipefail
          python tools/realestate/naver_land_chrome.py --out naver-land-results --limit 7
          python - <<'PY'
          import json
          with open('naver-land-results/summary.json', encoding='utf-8') as f: data=json.load(f)
          print('NAVER_REPORT_COUNTS',json.dumps({'areas':len(data['areas']),'rows':data['items'],
            'statuses':{x['slug']:x['status'] for x in data['areas']}},ensure_ascii=False))
          PY
      - name: Preserve evidence - screenshot, listing CSV and detailed JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-land-chrome-evidence
          path: naver-land-results/
          retention-days: 7
          if-no-files-found: warn
