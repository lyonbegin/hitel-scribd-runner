name: ProcureFlow - live direct POST method verification
run-name: "G2B DIRECT POST | 10 tabs | public original JSON vs contract clues"
on:
  push:
    branches: [research/procureflow-contract-web-probe-20261116]
    paths:
      - .github/workflows/procureflow-direct-post-live-test.yml
      - tools/procureflow/probe_direct_post_contract.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: procureflow-2y-direct-post-live-test
  cancel-in-progress: false

jobs:
  live-same-method:
    name: Run known opening detail direct POST and inspect official public route clues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome and Playwright
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then
            python -m playwright install --with-deps chrome
          fi
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          python -m py_compile tools/procureflow/probe_direct_post_contract.py
      - name: Direct G2B WebSquare POST, raw SHA256, 10 opened Chrome tabs
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            python tools/procureflow/probe_direct_post_contract.py
      - name: Retain exact source response bytes and evidence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procureflow-direct-post-live-${{ github.run_id }}
          path: ${{ runner.temp }}/pf2-direct-post-contract/
          if-no-files-found: warn
          retention-days: 90
