name: ProcureFlow 2Y - actual public contract-search JS API
run-name: "PF2 | retrieve fiCommonUntySrchLib.js official list .do route"
on:
  push:
    branches: [research/procureflow-contract-web-probe-20261116]
    paths:
      - .github/workflows/procureflow-real-public-contract-list-js.yml
      - tools/procureflow/probe_real_public_contract_search_js.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then python -m playwright install --with-deps chrome; fi
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y xvfb; fi
          python -m py_compile tools/procureflow/probe_real_public_contract_search_js.py
      - name: GET genuine contract search library and extract select list API
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            python tools/procureflow/probe_real_public_contract_search_js.py
      - name: Preserve raw public source JS with SHA256
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf2-unified-contract-search-js-${{ github.run_id }}
          path: ${{ runner.temp }}/pf2-public-contract-list-js/
          if-no-files-found: warn
          retention-days: 90
