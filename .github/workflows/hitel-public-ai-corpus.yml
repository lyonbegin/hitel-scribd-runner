name: HITEL 18109 AI classification - continue and verify
# 2026-11-19: controlled one-time 121-140 diagnostic retry after HTTP 500 and duplicate Chrome workers retired; 120 verified rows immutable.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hitel-public-ai-corpus.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smoke next 20 titles or continue full 18109 corpus'
        required: true
        type: choice
        options: [smoke, full]
        default: full

permissions:
  contents: read
  actions: write

concurrency:
  group: hitel-scribd-ai-18109-transport
  cancel-in-progress: false

jobs:
  ai:
    # 2026-11-19: verified real A/A/B/A v2 ChatGPT dialog, plus 40/40 verified actual Scribd title judgments.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact verified corpus and AI runner branch
        uses: actions/checkout@v4
        with:
          ref: feature/hitel-public-ai-batches-20261119

      - name: Assemble CSV and verify same original bytes, rows and unique document IDs
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,hashlib
          from pathlib import Path
          pieces=sorted(Path("data/raw_18109").glob("part_*.csv"))
          assert len(pieces)==20, len(pieces)
          joined="".join(p.read_text("utf-8") for p in pieces)
          original=b"\xef\xbb\xbf"+joined.replace("\n","\r\n").encode("utf-8")
          digest=hashlib.sha256(original).hexdigest()
          assert digest=="c9ac45f833dd30a002cffac64cb3ced763ed4eb18b0e121c4ab00b935a9b82e3", digest
          Path("Raw_Documents_18109.csv").write_bytes(original)
          with Path("Raw_Documents_18109.csv").open(encoding="utf-8-sig",newline="") as f:
              data=list(csv.DictReader(f))
          assert len(data)==18109,len(data)
          assert len(set(r["문서 ID"] for r in data))==18109
          print("SOURCE_VERIFIED 18109 18109",digest)
          PY
          python3 -m py_compile tools/zocbo/hitel_public_named_rooms_corpus.py

      - name: Restore latest prior verified AI completion checkpoints
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p hitel-ai-batches
          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=hitel-ai-18109-v3-checkpoint&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [[ -z "$RUN_ID" ]]; then
            # A known verified pilot: 20 real AI classifications (2026-11-19)
            RUN_ID=44442243981
            ARTIFACT_NAME=hitel-ai-18109-clean40-checkpoint
          else
            ARTIFACT_NAME=hitel-ai-18109-v3-checkpoint
          fi
          if [[ -n "$RUN_ID" ]]; then
            echo "RESTORING_CHECKPOINT_RUN=$RUN_ID"
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              -n "$ARTIFACT_NAME" -D hitel-ai-batches
            echo "RESTORE_OK"
          else
            echo "FIRST_RUN_NO_CHECKPOINT"
          fi

      - name: Guard restored checkpoint against stale failed runs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,json
          src=list(csv.DictReader(open('Raw_Documents_18109.csv',encoding='utf-8-sig',newline='')))
          completed=list(Path('hitel-ai-batches/completed').glob('*.json'))
          assert completed,'No completed AI classification checkpoint; refusing to treat a failed run as a seed'
          ids=set()
          for f in completed:
              obj=json.loads(f.read_text('utf-8'))
              for row in obj['rows']:
                  number=int(row['no'])
                  assert 1<=number<=len(src)
                  assert src[number-1]['문서 ID']==str(row['id']),'Checkpoint document ID/source mismatch'
                  assert number not in ids,'Duplicate completion'
                  ids.add(number)
          assert len(ids)>=120,'Checkpoint must retain 120 verified original classifications before the 121-140 retry'
          print('PASS_RESTORED_AI_COMPLETIONS',len(ids))
          PY

      - name: Record completed row count before this execution
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import json
          files=list(Path("hitel-ai-batches/completed").glob("*.json"))
          count=sum(len(json.loads(f.read_text("utf-8"))["rows"]) for f in files)
          print("AI_BEFORE="+str(count))
          PY

      - name: Execute bounded real public HITEL ChatGPT grouped classification
        id: classify
        continue-on-error: true
        timeout-minutes: 280
        shell: bash
        env:
          RUN_MODE: ${{ github.event.inputs.mode || 'full' }}
          # User-authorized retry only for terminal job 121-140, not future failures.
          HITEL_USER_AUTHORIZED_RETRY_JOB_ID: job_7ff121cde7004d89a4320e91a49acd3d
          HITEL_USER_AUTHORIZED_RETRY_SCOPE: 121-140-ONCE
        run: |
          if [[ "$RUN_MODE" == "smoke" ]]; then
            python3 tools/zocbo/hitel_public_named_rooms_corpus.py \
              --input Raw_Documents_18109.csv --out hitel-ai-batches \
              --limit 60 --batch-size 20 --max-batches 1 \
              --workers 1 --poll-seconds 14400 --recover-terminal-failed
          else
            python3 tools/zocbo/hitel_public_named_rooms_corpus.py \
              --input Raw_Documents_18109.csv --out hitel-ai-batches \
              --batch-size 20 --max-batches 1 \
              --workers 1 --poll-seconds 14400 --recover-terminal-failed
          fi

      - name: Verify every original row and count only real AI completed IDs
        id: verify
        shell: bash
        env:
          RUN_MODE: ${{ github.event.inputs.mode || 'full' }}
        run: |
          python3 - <<'PY'
          import csv,os
          from pathlib import Path
          original=list(csv.DictReader(open("Raw_Documents_18109.csv",encoding="utf-8-sig",newline="")))
          path=Path("hitel-ai-batches/Scribd_AI_분류결과.csv")
          assert path.exists(), "No AI results CSV created"
          classified=list(csv.DictReader(path.open(encoding="utf-8-sig",newline="")))
          expected=len(original) if os.environ["RUN_MODE"]=="full" else 60
          assert len(classified)==expected, (len(classified),expected)
          for idx,r in enumerate(classified):
              assert r["문서 ID"]==original[idx]["문서 ID"],"Original ID changed"
              assert r["원문 제목"]==original[idx]["원문 제목"],"Original title changed"
              assert r["번호"]==str(idx+1),"Original order changed"
          done=sum(r["학교급"]!="미처리" for r in classified)
          before=int(os.environ["AI_BEFORE"])
          full=len(original)
          remaining=full-done if os.environ["RUN_MODE"]=="full" else 60-done
          advance=done-before
          follow=(remaining>0 and advance>0) or (os.environ["RUN_MODE"]=="smoke" and done==60)
          print("REAL_AI_COMPLETED",done,"PREVIOUS_COMPLETED",before,"NEW_COMPLETED",advance,
                "TOTAL_CORPUS",full,"REMAINING_IN_RUN_SCOPE",remaining)
          with open(os.environ["GITHUB_OUTPUT"],"a") as o:
              o.write("completed="+str(done)+"\n")
              o.write("remaining="+str(remaining)+"\n")
              o.write("progress="+str(advance)+"\n")
              o.write("continue="+str(follow).lower()+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as s:
              s.write(f"AI verified: {done}/{full if os.environ['RUN_MODE']=='full' else 60}, new: {advance}\n")
          PY

      - name: Preserve results, 1:1 source mapping, and job checkpoints
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hitel-ai-18109-v3-checkpoint
          path: hitel-ai-batches/
          retention-days: 90
          if-no-files-found: warn

      - name: Mark incomplete no-progress or server failure as failed, after checkpoint upload
        if: steps.classify.outcome != 'success' || (steps.verify.outputs.progress == '0' && steps.verify.outputs.remaining != '0')
        run: |
          echo 'AI_UNFINISHED_OR_ERROR: inspect preserved real AI checkpoint, do not count as full completion'
          exit 1

      - name: Immediately continue to next verified AI batch window (no schedule)
        if: steps.verify.outputs.continue == 'true' && steps.classify.outcome == 'success' && steps.verify.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run hitel-public-ai-corpus.yml --ref main -f mode=full
          echo "NEXT_AI_CONTINUATION_REQUESTED" >> "$GITHUB_STEP_SUMMARY"
