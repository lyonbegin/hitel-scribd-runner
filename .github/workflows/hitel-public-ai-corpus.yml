name: HITEL 18109 AI classification - always advance; preserve unverified
# User policy: 300-second AI response budget per 20-row batch; preserve skipped results and continue. Preserve skipped rows separately; NEVER count them as verified. No cron.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hitel-public-ai-corpus.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smoke the next uncompleted 20 rows within the full original corpus, or continue the full corpus'
        required: true
        type: choice
        options: [smoke, full]
        default: full

permissions:
  contents: read
  actions: write

concurrency:
  group: hitel-scribd-ai-18109-transport
  cancel-in-progress: false

jobs:
  ai:
    # 2026-11-19: verified real A/A/B/A v2 ChatGPT dialog, plus 40/40 verified actual Scribd title judgments.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact verified corpus and AI runner branch
        uses: actions/checkout@v4
        with:
          ref: feature/hitel-public-ai-batches-20261119

      - name: Assemble CSV and verify same original bytes, rows and unique document IDs
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,hashlib
          from pathlib import Path
          pieces=sorted(Path("data/raw_18109").glob("part_*.csv"))
          assert len(pieces)==20, len(pieces)
          joined="".join(p.read_text("utf-8") for p in pieces)
          original=b"\xef\xbb\xbf"+joined.replace("\n","\r\n").encode("utf-8")
          digest=hashlib.sha256(original).hexdigest()
          assert digest=="c9ac45f833dd30a002cffac64cb3ced763ed4eb18b0e121c4ab00b935a9b82e3", digest
          Path("Raw_Documents_18109.csv").write_bytes(original)
          with Path("Raw_Documents_18109.csv").open(encoding="utf-8-sig",newline="") as f:
              data=list(csv.DictReader(f))
          assert len(data)==18109,len(data)
          assert len(set(r["문서 ID"] for r in data))==18109
          print("SOURCE_VERIFIED 18109 18109",digest)
          PY
          python3 -m py_compile tools/zocbo/hitel_public_named_rooms_corpus.py

      - name: Restore latest prior verified AI completion checkpoints
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p hitel-ai-batches
          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=hitel-ai-18109-v3-checkpoint&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [[ -z "$RUN_ID" ]]; then
            # A known verified pilot: 20 real AI classifications (2026-11-19)
            RUN_ID=44442243981
            ARTIFACT_NAME=hitel-ai-18109-clean40-checkpoint
          else
            ARTIFACT_NAME=hitel-ai-18109-v3-checkpoint
          fi
          if [[ -n "$RUN_ID" ]]; then
            echo "RESTORING_CHECKPOINT_RUN=$RUN_ID"
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              -n "$ARTIFACT_NAME" -D hitel-ai-batches
            echo "RESTORE_OK"
          else
            echo "FIRST_RUN_NO_CHECKPOINT"
          fi

      - name: Guard restored verified and skipped checkpoints against source mismatch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,json
          src=list(csv.DictReader(open('Raw_Documents_18109.csv',encoding='utf-8-sig',newline='')))
          done=set()
          skipped=set()
          for f in Path('hitel-ai-batches/completed').glob('*.json'):
              for row in json.loads(f.read_text('utf-8'))['rows']:
                  n=int(row['no'])
                  assert 1<=n<=len(src) and src[n-1]['문서 ID']==str(row['id'])
                  assert n not in done, 'Duplicate verified original'
                  done.add(n)
          for f in Path('hitel-ai-batches/skipped').glob('*.json'):
              obj=json.loads(f.read_text('utf-8'))
              assert obj.get('status')=='unverified_skipped' and obj.get('never_count_as_completed') is True
              for row in obj['source_ids']:
                  n=int(row['no'])
                  assert 1<=n<=len(src) and src[n-1]['문서 ID']==str(row['id'])
                  assert n not in skipped and n not in done, 'Duplicated verified/skipped row'
                  skipped.add(n)
          assert set(range(1,121)).issubset(done), 'Initial 120 AI rows must remain verified'
          processed=done|skipped
          assert processed==set(range(1,len(processed)+1)), 'Processed rows must be contiguous'
          print('PASS_RESTORED_AI_COMPLETIONS',len(done))
          print('PASS_UNVERIFIED_SKIPPED',len(skipped))
          print('PASS_PROCESSED_SOURCE_CURSOR',len(processed))
          PY

      - name: Record verified counts and processed source cursor
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import json
          verified=sum(len(json.loads(f.read_text("utf-8"))["rows"])
                       for f in Path("hitel-ai-batches/completed").glob("*.json"))
          skipped=sum(len(json.loads(f.read_text("utf-8"))["source_ids"])
                      for f in Path("hitel-ai-batches/skipped").glob("*.json"))
          print("AI_BEFORE="+str(verified))
          print("AI_UNVERIFIED_BEFORE="+str(skipped))
          print("AI_PROCESSED_BEFORE="+str(verified+skipped))
          PY

      - name: Reconcile saved completed Web2API job before next 20-title submission
        id: classify
        continue-on-error: true
        timeout-minutes: 280
        shell: bash
        env:
          RUN_MODE: ${{ github.event_name == 'push' && 'smoke' || github.event.inputs.mode || 'full' }}
        run: |
          if [[ "$RUN_MODE" == "smoke" ]]; then
            python3 tools/zocbo/hitel_public_named_rooms_corpus.py \
              --input Raw_Documents_18109.csv --out hitel-ai-batches \
              --batch-size 20 --max-batches 1 \
              --workers 1 --poll-seconds 300 --recover-terminal-failed
          else
            python3 tools/zocbo/hitel_public_named_rooms_corpus.py \
              --input Raw_Documents_18109.csv --out hitel-ai-batches \
              --batch-size 20 --max-batches 1 \
              --workers 1 --poll-seconds 300 --recover-terminal-failed
          fi

      - name: Verify original source and independently count verified, failed and processed rows
        id: verify
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,json,os
          from pathlib import Path
          original=list(csv.DictReader(open("Raw_Documents_18109.csv",encoding="utf-8-sig",newline="")))
          assert len(original)==18109, "Original source size changed"
          path=Path("hitel-ai-batches/Scribd_AI_분류결과.csv")
          assert path.exists(), "No results CSV created"
          classified=list(csv.DictReader(path.open(encoding="utf-8-sig",newline="")))
          assert len(classified)==len(original), "Original 18109 row count must be preserved"
          for i,row in enumerate(classified):
              assert row["문서 ID"]==original[i]["문서 ID"], "Original document ID changed"
              assert row["원문 제목"]==original[i]["원문 제목"], "Original title changed"
              assert row["Scribd 상세URL"]==original[i]["Scribd 상세URL"], "Original URL changed"
              assert row["번호"]==str(i+1), "Original order changed"
          verified={}
          required=("no","id","school","grade","semester","subject","edition","download","reason")
          for f in Path("hitel-ai-batches/completed").glob("*.json"):
              for row in json.loads(f.read_text("utf-8"))["rows"]:
                  no=int(row["no"])
                  assert no not in verified
                  assert 1<=no<=len(original) and str(row["id"])==original[no-1]["문서 ID"]
                  assert all(k in row and str(row[k]).strip() for k in required)
                  assert row["school"] in ("초등","중등","고등","대상외","판정보류")
                  assert row["download"] in ("대상","제외","판본검토")
                  verified[no]=row
          skipped={}
          for f in Path("hitel-ai-batches/skipped").glob("*.json"):
              marker=json.loads(f.read_text("utf-8"))
              assert marker.get("status")=="unverified_skipped"
              assert marker.get("never_count_as_completed") is True
              assert marker.get("reason")
              for row in marker["source_ids"]:
                  no=int(row["no"])
                  assert no not in skipped and no not in verified
                  assert 1<=no<=len(original) and str(row["id"])==original[no-1]["문서 ID"]
                  skipped[no]=marker["reason"]
          done=len(verified)
          rejected=len(skipped)
          processed=done+rejected
          before=int(os.environ["AI_BEFORE"])
          skipped_before=int(os.environ["AI_UNVERIFIED_BEFORE"])
          processed_before=int(os.environ["AI_PROCESSED_BEFORE"])
          assert before+skipped_before==processed_before
          assert set(range(1,processed+1))==set(verified)|set(skipped), "Source cursor contains gaps"
          assert set(range(1,121)).issubset(verified), "Never lose the verified original 120"
          assert sum(r["학교급"]!="미처리" for r in classified)==done, "CSV must count only verified rows"
          advance=processed-processed_before
          expected_advance=min(20,len(original)-processed_before)
          assert advance==expected_advance, ("Expected one next batch attempted",advance,expected_advance)
          assert done>=before and rejected>=skipped_before
          assert done-before+rejected-skipped_before==advance
          follow=(processed<len(original))
          print("REAL_AI_COMPLETED",done,"NEW_VERIFIED",done-before,
                "UNVERIFIED_SKIPPED",rejected,"NEW_SKIPPED",rejected-skipped_before,
                "PROCESSED",processed,"TOTAL_CORPUS",len(original),
                "REMAINING_UNATTEMPTED",len(original)-processed)
          with open(os.environ["GITHUB_OUTPUT"],"a") as o:
              o.write("completed="+str(done)+"\n")
              o.write("skipped="+str(rejected)+"\n")
              o.write("processed="+str(processed)+"\n")
              o.write("remaining="+str(len(original)-processed)+"\n")
              o.write("progress="+str(advance)+"\n")
              o.write("continue="+str(follow).lower()+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"AI verified: {done} | unverified skipped: {rejected} | source rows attempted: {processed}/{len(original)} | next: {processed+1 if follow else 'none'}\n")
          PY

      - name: Preserve results, 1:1 source mapping, and job checkpoints
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hitel-ai-18109-v3-checkpoint
          path: hitel-ai-batches/
          retention-days: 90
          if-no-files-found: warn

      - name: Fail only for unrecoverable execution or source/checkpoint corruption
        if: steps.classify.outcome != 'success' || steps.verify.outcome != 'success'
        run: |
          echo 'PROCESS_DID_NOT_PRESERVE_NEXT_SOURCE_WINDOW: artifact retained for recovery'
          exit 1

      - name: Continue next source window even when prior AI response failed validation
        if: steps.verify.outputs.continue == 'true' && steps.classify.outcome == 'success' && steps.verify.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run hitel-public-ai-corpus.yml --ref main -f mode=full
          echo "NEXT_AI_CONTINUATION_REQUESTED" >> "$GITHUB_STEP_SUMMARY"
