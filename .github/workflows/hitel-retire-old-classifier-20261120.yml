name: HITEL one-time cancel exact stale run 44535082496
on:
  push:
    branches: [main]
    paths: [".github/workflows/hitel-retire-old-classifier-20261120.yml"]
permissions:
  contents: read
  actions: write
jobs:
  stop-exact-stale-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only the explicitly selected old HITEL run; preserve artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TARGET="44535082496"
          STATE="$(gh api "repos/$REPO/actions/runs/$TARGET" --jq '.status')"
          echo "STUCK_HITEL_RUN=$TARGET PREVIOUS_STATUS=$STATE"
          if [[ "$STATE" == "in_progress" || "$STATE" == "queued" || "$STATE" == "pending" || "$STATE" == "waiting" ]]; then
            gh api --method POST "repos/$REPO/actions/runs/$TARGET/force-cancel" > /dev/null
            echo "REQUESTED_FORCE_CANCELLATION_FOR=$TARGET"
          else
            echo "ALREADY_TERMINAL=$TARGET STATE=$STATE"
          fi
          gh api "repos/$REPO/actions/runs/$TARGET" --jq '"POST_CANCEL_STATUS=" + .status + " RUN=" + (.id|tostring)'
