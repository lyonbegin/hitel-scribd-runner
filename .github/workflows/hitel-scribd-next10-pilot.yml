name: HITEL original Scribd next-10 adaptive AI pilot
on:
  push:
    branches: [main]
    paths: [.github/workflows/hitel-scribd-next10-pilot.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: hitel-scribd-ai-18109-transport
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hitel-public-ai-batches-20261119
      - name: Restore verified original 18109 rows and last known 20 completed AI results
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,hashlib
          from pathlib import Path
          parts=sorted(Path('data/raw_18109').glob('part_*.csv'))
          assert len(parts)==20
          content=b'\xef\xbb\xbf'+''.join(p.read_text('utf-8') for p in parts).replace('\n','\r\n').encode()
          assert hashlib.sha256(content).hexdigest()=='c9ac45f833dd30a002cffac64cb3ced763ed4eb18b0e121c4ab00b935a9b82e3'
          Path('Raw_Documents_18109.csv').write_bytes(content)
          with Path('Raw_Documents_18109.csv').open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==18109
          print('VERIFIED_SOURCE',len(rows))
          PY
          gh run download 44440096168 --repo "$GITHUB_REPOSITORY" \
            -n hitel-ai-18109-v2-checkpoint -D hitel-ai-batches
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('hitel-ai-batches/completed').glob('*.json'))
          done=[r for f in files for r in json.loads(f.read_text('utf-8'))['rows']]
          assert len(done)==20
          assert set(int(r['no']) for r in done)==set(range(1,21))
          print('VERIFIED_PREVIOUS_COMPLETIONS',len(done))
          PY
      - name: Send only original rows 21-30 as one 10-title AI batch
        shell: bash
        run: |
          python3 -m py_compile tools/zocbo/hitel_public_named_rooms_corpus.py
          python3 tools/zocbo/hitel_public_named_rooms_corpus.py \
            --input Raw_Documents_18109.csv --out hitel-ai-batches \
            --batch-size 10 --workers 1 --max-batches 1 --poll-seconds 420
      - name: Require exactly 30 verified original IDs and no duplicates
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          with open('hitel-ai-batches/Scribd_AI_분류결과.csv',encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==18109,len(rows)
          ok=[r for r in rows if r['학교급']!='미처리']
          assert len(ok)==30,('actual_ai_done',len(ok))
          assert set(int(r['번호']) for r in ok)==set(range(1,31))
          assert all(r['판정 근거'] for r in ok)
          print('PASS_REAL_AI_30_OF_18109',len(ok))
          print('NEW_AI_21_30',json.dumps([{'no':r['번호'],'title':r['원문 제목'],'school':r['학교급']} for r in rows[20:30]],ensure_ascii=False))
          PY
      - name: Publish checkpoints even when another server restart happens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-ai-18109-next10-checkpoint
          path: hitel-ai-batches/
          retention-days: 90
          if-no-files-found: warn
