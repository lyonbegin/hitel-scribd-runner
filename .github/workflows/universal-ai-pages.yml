name: HITEL Universal Pages
on:
  push:
    branches: [feature/hitel-universal-ai-ui-api-20261127]
    paths: ['universal/web/**', '.github/workflows/universal-ai-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hitel-universal-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: universal/web
      - uses: actions/deploy-pages@v4
        id: publish
