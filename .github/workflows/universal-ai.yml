name: HITEL Universal Actions backend
run-name: HITEL Universal ${{ inputs.handoff || github.run_id }}
on:
  push:
    branches: [feature/hitel-universal-ai-ui-api-20261127]
    paths: ['universal/engine.py', 'universal/notifications.py', 'universal/test_notifications.py', 'universal/test_engine.py', 'universal/watchdog.py', 'universal/projects/**', '.github/workflows/universal-ai.yml']
  workflow_dispatch:
    inputs:
      handoff:
        type: string
        default: direct
      depth:
        type: string
        default: '0'
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read
  id-token: write
concurrency:
  group: hitel-universal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline regression
        run: cd universal && python -m unittest -v test_engine test_notifications
      - name: Run durable project queue
        env:
          HITEL_ALLOW_LIVE: ${{ vars.HITEL_ALLOW_LIVE }}
          HITEL_EVENT_WEBHOOK_URL: ${{ secrets.HITEL_EVENT_WEBHOOK_URL }}
          HITEL_EVENT_WEBHOOK_SECRET: ${{ secrets.HITEL_EVENT_WEBHOOK_SECRET }}
          HITEL_NOTIFY_PR_ALLOWLIST: ${{ vars.HITEL_NOTIFY_PR_ALLOWLIST }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "hitel-universal[bot]"
          git config user.email "hitel-universal[bot]@users.noreply.github.com"
          python universal/engine.py
      - name: Preserve checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-checkpoint-${{ github.run_id }}
          path: universal/state/
          if-no-files-found: ignore
          retention-days: 90
  watchdog:
    needs: run
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Check pending work and bounded next-run handoff
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_DEPTH: ${{ inputs.depth || '0' }}
          HITEL_ALLOW_LIVE: ${{ vars.HITEL_ALLOW_LIVE }}
        run: python universal/watchdog.py
