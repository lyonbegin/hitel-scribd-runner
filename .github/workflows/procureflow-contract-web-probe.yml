name: ProcureFlow - read-only G2B contract UI reconnaissance
run-name: "G2B CONTRACT WEB | hosted Chrome | UI/network proof"
on:
  push:
    branches: [research/procureflow-contract-web-probe-20261116]
    paths:
      - .github/workflows/procureflow-contract-web-probe.yml
      - tools/procureflow/probe_contract_public_ui.py
      - tools/procureflow/schema_2y_core.sql
      - tools/procureflow/probe_g2b_public_bundles.py
      - tests/test_procureflow_2y_schema.sql
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: procureflow-public-contract-probe
  cancel-in-progress: false

jobs:
  inspect-public-g2b:
    name: Inspect public G2B contract navigation without login or data modification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated Chrome and playwright
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then
            python -m playwright install --with-deps chrome
          fi
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          python -m py_compile tools/procureflow/probe_contract_public_ui.py
      - name: Inspect only public G2B pages and network metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/procureflow-g2b-probe"
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            python tools/procureflow/probe_contract_public_ui.py \
              --site g2b --outdir "$RUNNER_TEMP/procureflow-g2b-probe"
      - name: Inspect public report portal and shopping portal in sequence
        shell: bash
        run: |
          set -euo pipefail
          for site in data shop; do
            echo "PUBLIC_SITE_START=$site"
            mkdir -p "$RUNNER_TEMP/procureflow-$site-probe"
            xvfb-run -a -s '-screen 0 1920x1080x24' \
              python tools/procureflow/probe_contract_public_ui.py \
                --site "$site" --outdir "$RUNNER_TEMP/procureflow-$site-probe"
          done
      - name: Save screenshots, navigation and limited network metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procureflow-g2b-public-ui-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/procureflow-g2b-probe/
            ${{ runner.temp }}/procureflow-data-probe/
            ${{ runner.temp }}/procureflow-shop-probe/
          if-no-files-found: warn
          retention-days: 90

  validate-two-year-schema:
    name: Validate isolated PostgreSQL tables, duplicate policy, FK and join arithmetic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: proc_test
          POSTGRES_PASSWORD: proc_test
          POSTGRES_DB: proc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proc_test -d proc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: proc_test
      PGPASSWORD: proc_test
      PGDATABASE: proc_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply isolated schema in disposable database
        run: psql --set ON_ERROR_STOP=on --file tools/procureflow/schema_2y_core.sql
      - name: Check distinct bidder rows, award non-identity and contracts not multiplied
        run: psql --set ON_ERROR_STOP=on --file tests/test_procureflow_2y_schema.sql
      - name: Confirm resulting table count
        run: |
          psql --set ON_ERROR_STOP=on -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='procureflow_2y';"

  inspect-websquare-public-bundles:
    name: Inspect public WebSquare JS and contract route clues (no login)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only HTTP probe dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Fetch only observed public JS assets and extract safe path clues
        run: python tools/procureflow/probe_g2b_public_bundles.py
      - name: Save JS status, hashes and safe search results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procureflow-public-websquare-js-${{ github.run_id }}
          path: procureflow_bundle_report.json
          if-no-files-found: warn
          retention-days: 90
