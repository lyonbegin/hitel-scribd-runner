name: Seoul homestay 25-district public permit collection
on:
  push:
    branches:
      - research/seoul-homestay-public-20261121
    paths:
      - .github/workflows/seoul-homestay-public-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download all Seoul district original licensing records
        run: python3 tools/realestate/seoul_homestay_collect_all.py
      - name: Preserve full original records, candidate subset and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-homestay-25-district-source
          path: artifacts/seoul-homestay/
          if-no-files-found: warn
          retention-days: 7
