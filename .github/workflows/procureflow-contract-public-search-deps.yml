name: ProcureFlow 2Y - public contract search JS dependencies
run-name: "PF2 | trace official contract list API from WebSquare search screen"
on:
  push:
    branches: [research/procureflow-contract-web-probe-20261116]
    paths:
      - .github/workflows/procureflow-contract-public-search-deps.yml
      - tools/procureflow/discover_g2b_public_contract_search_component.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then python -m playwright install --with-deps chrome; fi
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y xvfb; fi
          python -m py_compile tools/procureflow/discover_g2b_public_contract_search_component.py
      - name: GET read-only shipped JS and print public contract search modules
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            python tools/procureflow/discover_g2b_public_contract_search_component.py
      - name: Preserve raw source and search report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf2-contract-search-dependencies-${{ github.run_id }}
          path: ${{ runner.temp }}/pf2-contract-public-search-deps/
          if-no-files-found: warn
          retention-days: 90
