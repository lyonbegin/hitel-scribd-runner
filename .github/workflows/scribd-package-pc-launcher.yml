name: HITEL package one-click Scribd PC launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/scribd-package-pc-launcher.yml
      - ops/HITEL-Scribd-Start.ps1
      - ops/1_Chrome_Start.ps1
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact verified queue and package Windows launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/15090814514/zip > queue.zip
          echo 'e51490e03db1c16e6a1719c4f025a55241dc99f81a5d9060b715e42f583fac19  queue.zip' | sha256sum -c -
          python3 - <<'PY'
          import csv,hashlib,io,zipfile,pathlib
          out=pathlib.Path("HITEL-Scribd-PC");out.mkdir()
          with zipfile.ZipFile("queue.zip") as z:
              data=z.read("download_queue.csv")
          assert hashlib.sha256(data).hexdigest()=="07533a58ab96ab4e31cc53f7d6ad9d4a83f3c390e99c0a399b0cfaa7aa00b6f6"
          rows=list(csv.DictReader(io.StringIO(data.decode("utf-8-sig"))))
          assert len(rows)==len({r["document_id"] for r in rows})==7210
          assert sum(r["download_decision"]=="대상" for r in rows)==1725
          assert sum(r["download_decision"]=="판본검토" for r in rows)==5485
          (out/"download_queue.csv").write_bytes(data)
          ps=pathlib.Path("ops/HITEL-Scribd-Start.ps1").read_text(encoding="utf-8-sig")
          engine=ps.split("$source = @'\n",1)[1].split("\n'@",1)[0]
          compile(engine,"embedded-download.py","exec")
          import ast,re,tempfile
          tree=ast.parse(engine)
          funcs=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in ("pdf","existing_pdf_ids")]
          assert len(funcs)==2
          env={"re":re}
          exec(compile(ast.Module(body=funcs,type_ignores=[]),"dedup-test","exec"),env)
          with tempfile.TemporaryDirectory() as tmp:
              root=pathlib.Path(tmp)
              (root/"101_old.PDF").write_bytes(b"%PDF-1.7")
              (root/"102_old").write_bytes(b"%PDF-1.7")
              (root/"103_bad.pdf").write_bytes(b"html")
              (root/"104_incomplete.part").write_bytes(b"%PDF-1.7")
              (root/"nested").mkdir()
              (root/"nested"/"105_saved.pdf").write_bytes(b"%PDF-1.7")
              assert env["existing_pdf_ids"](root,{"101","102","103","104","105"})=={"101","102","105"}
          import asyncio
          pool=next(n for n in tree.body if isinstance(n,ast.AsyncFunctionDef) and n.name=="run_worker_pool")
          env={"asyncio":asyncio}
          exec(compile(ast.Module(body=[pool],type_ignores=[]),"pool-test","exec"),env)
          async def test_pool():
              active=0;peak=0;started=[];finished=[]
              release=asyncio.Event();refilled=asyncio.Event()
              async def worker(row,index):
                  nonlocal active,peak
                  active+=1;peak=max(peak,active);started.append(index)
                  try:
                      if index<=9:await release.wait()
                      elif index==11:refilled.set()
                      await asyncio.sleep(0)
                  finally:
                      active-=1;finished.append(index)
              task=asyncio.create_task(env["run_worker_pool"](list(range(23)),worker,limit=10))
              try:
                  await asyncio.wait_for(refilled.wait(),timeout=2)
                  assert 11 in started and not any(i<=9 for i in finished)
                  assert peak==10
              finally:
                  release.set()
                  await task
              assert sorted(started)==sorted(finished)==list(range(1,24))
              assert active==0 and peak==10
          asyncio.run(test_pool())
          assert "await run_worker_pool(pending,worker,limit=10)" in engine
          print("WORKER_POOL_TEST_OK IMMEDIATE_REFILL MAX_10 NO_DUPLICATE")
          original=pathlib.Path("tools/zocbo/scribd_pc_cdp_attach.py").read_text(encoding="utf-8")
          original=original[original.index("async def one_permitted_download_test("):original.index("async def main_async(")].rstrip()
          assert original in engine
          print("DEDUP_TEST_OK CONCURRENCY_10 ORIGINAL_FUNCTION_UNCHANGED")
          probe=ps.split("$probeSource = @'\n",1)[1].split("\n'@",1)[0]
          compile(probe,"embedded-cdp-probe.py","exec")
          (out/"2_Download_Start.ps1").write_bytes(ps.encode("utf-8-sig"))
          (out/"1_Chrome_Start.ps1").write_bytes(pathlib.Path("ops/1_Chrome_Start.ps1").read_text(encoding="utf-8-sig").encode("utf-8-sig"))
          print("PACKAGE_VERIFIED_7210_AND_PYTHON_COMPILED")
          PY
      - name: Parse PowerShell launcher
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          foreach ($file in (Get-ChildItem "$PWD/HITEL-Scribd-PC" -Filter *.ps1)) {
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Out-String | Write-Host; throw "PowerShell parse failed" }
          }
          Write-Host 'POWERSHELL_SYNTAX_OK'
      - uses: actions/upload-artifact@v4
        with:
          name: HITEL-Scribd-PC
          path: HITEL-Scribd-PC/
          if-no-files-found: error
          retention-days: 90
  windows-cdp-test:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HITEL-Scribd-PC
          path: HITEL-Scribd-PC
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Launch actual Windows Chrome and verify CDP, no sign-in or download
        shell: powershell
        env:
          HITEL_CDP_SELFTEST: '1'
        run: |
          $ErrorActionPreference='Stop'
          & "$PWD\HITEL-Scribd-PC\1_Chrome_Start.ps1"
          & "$PWD\HITEL-Scribd-PC\2_Download_Start.ps1"
      - name: Preserve Chrome startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cdp-diagnostics
          path: ~/AppData/Local/HITEL/ScribdPC/chrome-start.log
          if-no-files-found: ignore
