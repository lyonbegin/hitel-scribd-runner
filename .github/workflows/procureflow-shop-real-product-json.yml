name: ProcureFlow - live shop product JSON direct POST
run-name: "PF2 SHOP | actual product rows JSON and page2 sha256"
on:
  push:
    branches: [research/procureflow-contract-web-probe-20261116]
    paths:
      - .github/workflows/procureflow-shop-real-product-json.yml
      - tools/procureflow/test_real_shop_product_json.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-products:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Setup Chrome and Python
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then python -m playwright install --with-deps chrome; fi
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y xvfb; fi
          python -m py_compile tools/procureflow/test_real_shop_product_json.py
      - name: Same-session real public goods catalog API JSON POST
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            python tools/procureflow/test_real_shop_product_json.py
      - name: Preserve all raw product JSON and independent SHA256
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf2-shop-real-product-json-${{ github.run_id }}
          path: ${{ runner.temp }}/pf2-shop-real-products/
          retention-days: 90
          if-no-files-found: warn
