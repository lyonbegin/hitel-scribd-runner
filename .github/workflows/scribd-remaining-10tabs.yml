name: Scribd 1149 unresolved - One Chrome 10 Concurrent Tabs
run-name: "Scribd remaining | Chrome 1 x 10 tabs"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/scribd-remaining-10tabs.yml

permissions:
  contents: read

concurrency:
  group: scribd-1149-10tabs
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'lyonbegin/hitel-scribd-runner'
    runs-on: self-hosted
    timeout-minutes: 75
    defaults:
      run:
        shell: powershell
    steps:
      - name: Fetch audited code directly with Git (avoid checkout EBUSY)
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Windows runner is required' }
          if (Test-Path src\.git) {
            git -C src fetch --depth 1 origin main
            if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
            git -C src reset --hard origin/main
            if ($LASTEXITCODE -ne 0) { throw 'git reset failed' }
          } else {
            git clone --depth 1 --branch main https://github.com/lyonbegin/hitel-scribd-runner.git src
            if ($LASTEXITCODE -ne 0) { throw 'git clone failed' }
          }
          foreach ($path in @(
            'src/tools/zocbo/scribd_10tabs_remaining.py',
            'src/tools/zocbo/pending_1149_ids.zlib64',
            'src/tools/zocbo/attempted_43224551981_ids.txt',
            'src/tools/zocbo/attempted_43344449923_ids.csv'
          )) {
            if (-not (Test-Path $path)) { throw "Missing audited source file: $path" }
          }
      - name: Install required Playwright package if missing
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command py -ErrorAction SilentlyContinue) {
            py -3 -m pip show playwright
            if ($LASTEXITCODE -ne 0) {
              py -3 -m pip install --disable-pip-version-check playwright==1.56.0
              if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed' }
            }
          } else {
            python -m pip show playwright
            if ($LASTEXITCODE -ne 0) {
              python -m pip install --disable-pip-version-check playwright==1.56.0
              if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed' }
            }
          }
      - name: Validate remaining queue and both prior visit logs
        run: |
          $cmd = @(
            'src/tools/zocbo/scribd_10tabs_remaining.py',
            '--ids-file', 'src/tools/zocbo/pending_1149_ids.zlib64',
            '--skip-prior-file', 'src/tools/zocbo/attempted_43224551981_ids.txt',
            '--skip-current-file', 'src/tools/zocbo/attempted_43344449923_ids.csv',
            '--dry-run'
          )
          if (Get-Command py -ErrorAction SilentlyContinue) {
            & py -3 @cmd
          } else {
            & python @cmd
          }
          if ($LASTEXITCODE -ne 0) { throw 'Audited remaining queue validation failed' }
      - name: Run one Chrome with ten concurrent tabs and persist per-result CSV
        run: |
          $cmd = @(
            'src/tools/zocbo/scribd_10tabs_remaining.py',
            '--ids-file', 'src/tools/zocbo/pending_1149_ids.zlib64',
            '--skip-prior-file', 'src/tools/zocbo/attempted_43224551981_ids.txt',
            '--skip-current-file', 'src/tools/zocbo/attempted_43344449923_ids.csv',
            '--out', 'scribd-review-results',
            '--tabs', '10'
          )
          if (Get-Command py -ErrorAction SilentlyContinue) {
            & py -3 @cmd
          } else {
            & python @cmd
          }
          if ($LASTEXITCODE -ne 0) { throw 'Chrome ten-tab crawl failed or site challenge stopped it' }
      - name: Print actual progress
        if: always()
        run: |
          if (Test-Path scribd-review-results/summary.json) {
            Get-Content scribd-review-results/summary.json
          } elseif (Test-Path scribd-review-results/results.csv) {
            $lines = @(Get-Content scribd-review-results/results.csv)
            Write-Host "PARTIAL_RESULTS_CSV_DATA_ROWS=$($lines.Count - 1)"
          } else {
            Write-Host 'No document processing results yet'
          }
      - name: Upload screenshots and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scribd-1149-10tabs-results
          path: scribd-review-results/
          if-no-files-found: warn
          retention-days: 14
