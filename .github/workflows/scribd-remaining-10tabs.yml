name: Scribd 2623 backlog - resilient ten-tab public preview review
run-name: "Scribd 2623 resumed | bounded Chrome 10 tabs"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/scribd-remaining-10tabs.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: scribd-2623-resilient
  cancel-in-progress: true

jobs:
  publish-run-pointer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write run id to repository for independent log monitoring
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_id }}
          COMMIT_ID: ${{ github.sha }}
        run: |
          python3 - <<'PY' > /tmp/scribd-run.json
          import json, os
          print(json.dumps({
            "run_id": int(os.environ["RUN_NUMBER"]),
            "run_url": "https://github.com/" + os.environ["REPO_NAME"] + "/actions/runs/" + os.environ["RUN_NUMBER"],
            "status": "workflow_started",
            "workflow": "scribd-remaining-10tabs.yml",
            "commit": os.environ["COMMIT_ID"],
          }, indent=2))
          PY
          old_sha=$(gh api "repos/$REPO_NAME/contents/ops/latest_scribd_run.json" --jq .sha)
          content=$(base64 -w0 < /tmp/scribd-run.json)
          gh api -X PUT "repos/$REPO_NAME/contents/ops/latest_scribd_run.json" \
            -f message="Track Scribd Actions run $RUN_NUMBER" \
            -f content="$content" -f sha="$old_sha" \
            --jq '.commit.sha'
  audit:
    needs: publish-run-pointer
    if: github.repository == 'lyonbegin/hitel-scribd-runner'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - name: Require interactive desktop session for visible Chrome
        run: |
          $ErrorActionPreference = 'Stop'
          $session = (Get-Process -Id $PID).SessionId
          Write-Host "GUI_PREFLIGHT runner_name=$env:RUNNER_NAME session_id=$session user=$(whoami)"
          if ($session -eq 0) {
            throw 'DESKTOP_SESSION_UNAVAILABLE: Windows runner is in service/session 0; visible Chrome requires an interactive runner started in a logged-in Windows session.'
          }
      - name: Fetch audited code directly with Git (avoid checkout EBUSY)
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Windows runner is required' }
          if (Test-Path src\.git) {
            git -C src fetch --depth 1 origin main
            if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
            git -C src reset --hard origin/main
            if ($LASTEXITCODE -ne 0) { throw 'git reset failed' }
          } else {
            git clone --depth 1 --branch main https://github.com/lyonbegin/hitel-scribd-runner.git src
            if ($LASTEXITCODE -ne 0) { throw 'git clone failed' }
          }
          foreach ($path in @(
            'src/tools/zocbo/scribd_10tabs_remaining.py',
            'src/tools/zocbo/remaining_unclassified_2623_ids.txt',
            'src/tools/zocbo/attempted_43224551981_ids.txt',
            'src/tools/zocbo/attempted_43344449923_ids.csv',
            'src/tools/zocbo/attempted_43377032832_from_logs.csv',
            'src/tools/zocbo/attempted_43414135287_smoke_success.csv'
          )) {
            if (-not (Test-Path $path)) { throw "Missing audited source file: $path" }
          }
      - name: Install required Playwright package if missing
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command py -ErrorAction SilentlyContinue) {
            py -3 -m pip show playwright
            if ($LASTEXITCODE -ne 0) {
              py -3 -m pip install --disable-pip-version-check playwright==1.56.0
              if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed' }
            }
          } else {
            python -m pip show playwright
            if ($LASTEXITCODE -ne 0) {
              python -m pip install --disable-pip-version-check playwright==1.56.0
              if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed' }
            }
          }
      - name: Validate original 2623 ID queue, prior CSV and watchdog
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'RESTORE_SKIPPED: 366MB screenshot artifact is not required to start browser'
          Write-Host 'DEDUP_SOURCE: 573 + 641 earlier attempts and 1063 verified latest log IDs'
          $script = 'src/tools/zocbo/scribd_10tabs_remaining.py'
          $cmd = @(
            $script,
            '--ids-file', 'src/tools/zocbo/remaining_unclassified_2623_ids.txt',
            '--skip-prior-file', 'src/tools/zocbo/attempted_43224551981_ids.txt',
            '--skip-current-file', 'src/tools/zocbo/attempted_43344449923_ids.csv',
            '--skip-latest-file', 'src/tools/zocbo/attempted_43377032832_from_logs.csv',
            '--skip-smoke-file', 'src/tools/zocbo/attempted_43414135287_smoke_success.csv',
            '--out', 'scribd-remaining-results',
            '--tabs', '10'
          )
          if (Get-Command py -ErrorAction SilentlyContinue) {
            & py -3 -m py_compile $script
            if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
            & py -3 $script --self-test
            if ($LASTEXITCODE -ne 0) { throw 'Watchdog/checkpoint self-test failed' }
            & py -3 @cmd --dry-run
          } else {
            & python -m py_compile $script
            if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
            & python $script --self-test
            if ($LASTEXITCODE -ne 0) { throw 'Watchdog/checkpoint self-test failed' }
            & python @cmd --dry-run
          }
          if ($LASTEXITCODE -ne 0) { throw '2623 pending IDs or prior checkpoints failed validation' }
      - name: Real Chrome preflight on next 10 unvisited documents
        run: |
          $ErrorActionPreference = 'Stop'
          $priorStable = @()
          if (Test-Path scribd-remaining-results/results.csv) {
            $priorStable = @(Import-Csv scribd-remaining-results/results.csv |
              Where-Object { $_.status -notin @('error','timeout') } |
              ForEach-Object { $_.document_id })
          }
          Write-Host "SMOKE_BASELINE stable_before=$($priorStable.Count)"
          $cmd = @(
            'src/tools/zocbo/scribd_10tabs_remaining.py',
            '--ids-file', 'src/tools/zocbo/remaining_unclassified_2623_ids.txt',
            '--skip-prior-file', 'src/tools/zocbo/attempted_43224551981_ids.txt',
            '--skip-current-file', 'src/tools/zocbo/attempted_43344449923_ids.csv',
            '--skip-latest-file', 'src/tools/zocbo/attempted_43377032832_from_logs.csv',
            '--skip-smoke-file', 'src/tools/zocbo/attempted_43414135287_smoke_success.csv',
            '--out', 'scribd-remaining-results',
            '--tabs', '10', '--limit', '10'
          )
          if (Get-Command py -ErrorAction SilentlyContinue) { & py -3 @cmd } else { & python @cmd }
          if ($LASTEXITCODE -ne 0) { throw '10-tab Chrome preflight crashed' }
          $actual = @(Import-Csv scribd-remaining-results/results.csv)
          $newRows = @($actual | Where-Object { $priorStable -notcontains $_.document_id })
          $newIds = @($newRows | ForEach-Object { $_.document_id } | Select-Object -Unique)
          $newPreview = @($newRows | Where-Object { $_.status -eq 'preview_visible' }).Count
          $newFatal = @($newRows | Where-Object { $_.status -in @('timeout','error','blocked') }).Count
          Write-Host "SMOKE_TEST_RESULT new_docs=$($newRows.Count) unique=$($newIds.Count) preview=$newPreview fatal=$newFatal"
          if ($newRows.Count -ne 10 -or $newIds.Count -ne 10) {
            throw 'Preflight did not complete 10 new unique documents; bulk disabled'
          }
          if ($newPreview -lt 7 -or $newFatal -gt 0) {
            throw 'Preflight did not meet 7/10 preview and zero hard-error rule; bulk disabled'
          }
      - name: Crawl all remaining unvisited 2623-queue IDs with recycled Chrome
        run: |
          $cmd = @(
            'src/tools/zocbo/scribd_10tabs_remaining.py',
            '--ids-file', 'src/tools/zocbo/remaining_unclassified_2623_ids.txt',
            '--skip-prior-file', 'src/tools/zocbo/attempted_43224551981_ids.txt',
            '--skip-current-file', 'src/tools/zocbo/attempted_43344449923_ids.csv',
            '--skip-latest-file', 'src/tools/zocbo/attempted_43377032832_from_logs.csv',
            '--skip-smoke-file', 'src/tools/zocbo/attempted_43414135287_smoke_success.csv',
            '--out', 'scribd-remaining-results',
            '--tabs', '10', '--batch-size', '80',
            '--document-timeout', '80', '--batch-timeout', '1200', '--retries', '1'
          )
          if (Get-Command py -ErrorAction SilentlyContinue) { & py -3 @cmd } else { & python @cmd }
          if ($LASTEXITCODE -ne 0) { throw 'Crawl stopped; inspect per-document results and checkpoint' }
      - name: Print actual progress
        if: always()
        run: |
          if (Test-Path scribd-remaining-results/summary.json) {
            Get-Content scribd-remaining-results/summary.json
          } elseif (Test-Path scribd-remaining-results/results.csv) {
            $lines = @(Get-Content scribd-remaining-results/results.csv)
            Write-Host "PARTIAL_RESULTS_CSV_DATA_ROWS=$($lines.Count - 1)"
          } else {
            Write-Host 'No document processing results yet'
          }
      - name: Upload lightweight CSV checkpoint for future resume
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scribd-2623-resume-checkpoint
          path: |
            scribd-remaining-results/results.csv
            scribd-remaining-results/summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload screenshots and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scribd-2623-resilient-resumed-results
          path: scribd-remaining-results/
          if-no-files-found: warn
          retention-days: 14
