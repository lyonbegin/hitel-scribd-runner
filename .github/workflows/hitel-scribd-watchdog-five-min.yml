name: HITEL Scribd checkpoint diagnostic (manual read-only)
# Historical filename preserved so no second watchdog is introduced.
# No schedule, no workflow_run, no restart, no cancellation and NO chat POST.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read-only isolated Scribd status, no task mutation
        run: |
          python3 - <<'PY'
          import json,urllib.request
          root="https://hitel-integration-api-production.up.railway.app/integrations/v1/public/"
          for suffix in (
              "isolated/tasks/scribd-18109/status",
              "jobs/job_769d8fbcaf034b8ebf5ca4e8d9ef3ce6",
          ):
              with urllib.request.urlopen(root+suffix,timeout=15) as r:
                  result=json.load(r)
              if suffix.startswith("jobs/"):
                  print("SCRIBD_PRIOR_JOB_READ_ONLY",
                        result.get("job_id"),result.get("status"),
                        result.get("error_code"),result.get("result_ready"))
              else:
                  print("SCRIBD_TASK_READ_ONLY",result.get("task_id"),
                        "connected",result.get("worker_connected"),
                        "queued",result.get("queued_jobs_count"))
          print("PASS_NO_DISPATCH_NO_CHROME_NO_CHAT_SEND")
          PY
