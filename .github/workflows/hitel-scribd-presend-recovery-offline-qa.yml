name: Scribd 5001 source-proof recovery offline QA
on:
  push:
    branches: [fix/scribd-presend-proof-handoff-20261123]
    paths:
      - tools/zocbo/hitel_scribd_http_continue.py
      - tools/zocbo/test_hitel_presend_recovery.py
      - .github/workflows/hitel-scribd-presend-recovery-offline-qa.yml
      - docs/HITEL_SCRIBD_5001_PRESEND_RECOVERY_HANDOFF_20261123.md
  pull_request:
    paths:
      - tools/zocbo/hitel_scribd_http_continue.py
      - tools/zocbo/test_hitel_presend_recovery.py
      - .github/workflows/hitel-scribd-presend-recovery-offline-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-send:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scribd-presend-proof-handoff-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source compiles, signed recovery stays off by default
        run: |
          set -euo pipefail
          python3 -m py_compile tools/zocbo/hitel_scribd_http_continue.py tools/zocbo/test_hitel_presend_recovery.py
          python3 tools/zocbo/test_hitel_presend_recovery.py
          echo SCRIBD_SOURCE_PINNED_RECOVERY_TESTED_NO_LIVE_POST >> "$GITHUB_STEP_SUMMARY"
