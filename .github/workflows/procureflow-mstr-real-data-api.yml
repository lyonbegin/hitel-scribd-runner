name: ProcureFlow - public report data API verification
run-name: "PF2 038R | actual MSTR provider code and raw source verification"
on:
  push:
    branches: [research/procureflow-contract-web-probe-20261116]
    paths:
      - .github/workflows/procureflow-mstr-real-data-api.yml
      - tools/procureflow/probe_datahub_mstr_api_source.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Prepare Chrome
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.56.0
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then python -m playwright install --with-deps chrome; fi
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y xvfb; fi
          python -m py_compile tools/procureflow/probe_datahub_mstr_api_source.py
      - name: Read official MicroStrategy report and export source JS
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            python tools/procureflow/probe_datahub_mstr_api_source.py
      - name: Save raw JS and SHA256
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf2-mstr-report-api-${{ github.run_id }}
          path: ${{ runner.temp }}/pf2-report-api-source/
          if-no-files-found: warn
          retention-days: 90
